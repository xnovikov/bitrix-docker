server {
    listen 80;
    server_name localhost;
    charset utf-8;
    root /var/www/html;
    index index.php index.html;

    client_max_body_size 100M;

    access_log /var/log/nginx/bitrix-access.log;
    error_log /var/log/nginx/bitrix-error.log;

    # Битрикс специфичные настройки
    location / {
        try_files $uri $uri/ @bitrix;
    }

    location @bitrix {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/bitrix/urlrewrite.php;
    }

    # Обработка PHP файлов
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Защита от прямого доступа к служебным файлам
    location ~ /\.ht {
        deny all;
    }

    location ~* ^/bitrix/admin/(.*\.php)$ {
        try_files $uri @bitrixadm;
    }

    location @bitrixadm {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Кэширование статики
    location ~* \.(jpg|jpeg|gif|png|svg|js|css|mp3|ogg|mpe?g|avi|zip|gz|bz2?|rar|swf|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Запрет на служебные директории
    location ~ ^/bitrix/(modules|local_cache|stack_cache|managed_cache|php_interface) {
        deny all;
    }

    location ~ ^/upload/1c_[^/]+/ {
        deny all;
    }

    location ~ /composer {
        deny all;
    }

    location ~ \.settings\.php$ {
        deny all;
    }
}