version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: bitrix_nginx
    ports:
      - "80:80"
      - "443:443"
      - "0.0.0.0:8080:80"
    volumes:
      - ./www:/var/www/html
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - php
    networks:
      - bitrix_network
    restart: unless-stopped

  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: bitrix_php
    volumes:
      - ./www:/var/www/html
      - ./php/php.ini:/usr/local/etc/php/php.ini
    depends_on:
      - mysql
      - redis
    networks:
      - bitrix_network
    restart: unless-stopped
    environment:
      - PHP_IDE_CONFIG=serverName=bitrix.local

  mysql:
    image: mysql:8.0
    container_name: bitrix_mysql
    ports:
      - "3306:3306"
      - "0.0.0.0:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bitrix
      MYSQL_USER: bitrix
      MYSQL_PASSWORD: bitrix
    command: --default-authentication-plugin=mysql_native_password --sql_mode=""
    networks:
      - bitrix_network
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: bitrix_redis
    ports:
      - "6379:6379"
    networks:
      - bitrix_network
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: bitrix_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - mysql
    networks:
      - bitrix_network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  bitrix_network:
    driver: bridge